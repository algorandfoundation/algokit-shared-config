name: Python Release

on:
  workflow_call:
    inputs:
      working-directory:
        required: false
        type: string
        default: "."
      artifact-name:
        required: false
        type: string
        default: "python-dist"
      production_release:
        required: false
        type: boolean
        default: false
    secrets:
      BOT_ID:
        required: true
      BOT_SK:
        required: true
    outputs:
      released:
        description: "Whether a new version was released"
        value: ${{ jobs.release.outputs.released }}
      tag:
        description: "The git tag of the release"
        value: ${{ jobs.release.outputs.tag }}
      artifact-name:
        description: "The name of the uploaded dist artifact"
        value: ${{ inputs.artifact-name }}

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.semantic-release.outputs.released }}
      tag: ${{ steps.semantic-release.outputs.tag }}
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.BOT_ID }}
          private-key: ${{ secrets.BOT_SK }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Semantic Release
        id: semantic-release
        uses: algorandfoundation/algokit-shared-config/.github/actions/python-semantic-release@feat/python-release-workflow
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          production_release: ${{ inputs.production_release }}
          working-directory: ${{ inputs.working-directory }}

      - name: Upload dist artifact
        if: steps.semantic-release.outputs.released == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.working-directory }}/dist/
