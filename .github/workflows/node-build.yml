on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: 18.x
      working-directory:
        required: false
        type: string
        default: "."
      build-path:
        required: false
        type: string
        default: build
      artifact-name:
        required: false
        type: string
        default: node-app
      pre-run-script:
        required: false
        type: string
    secrets:
      npm-auth-token:
        description: NPM auth token (optional, GITHUB_TOKEN is used by default)
        required: false

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 1. Install pnpm first so setup-node can "see" it
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      # 2. Setup Node and handle caching in one block
      - name: Use Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: "https://npm.pkg.github.com"
          cache: "pnpm"
          # Since you're in a consumer root, this keeps the cache stable
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Pre-run
        if: ${{ inputs.pre-run-script }}
        run: ${{ inputs.pre-run-script }}

      # 3. Install dependencies
      - run: pnpm install --frozen-lockfile --ignore-scripts --prod=false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm-auth-token || secrets.GITHUB_TOKEN }}

      - run: pnpm rebuild && pnpm run prepare --if-present

      - name: Prepare
        run: pnpm run prepare --if-present

      - name: Build
        run: pnpm run build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm-auth-token || secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.working-directory }}/${{ inputs.build-path }}
          if-no-files-found: error
