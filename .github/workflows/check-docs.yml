on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: 22.x

jobs:
  check_docs:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            docs/pnpm-lock.yaml

      - name: Check docs are up to date
        shell: bash
        run: |
          set -euo pipefail
          pnpm fetch --frozen-lockfile --prod=false
          pnpm install --frozen-lockfile --prod=false --offline

          if [ -f docs/package.json ]; then
            pnpm --dir docs fetch --frozen-lockfile --prod=false
            pnpm --dir docs install --frozen-lockfile --prod=false --offline
          fi

          if ! pnpm run generate:code-docs; then
            echo "Docs generation failed. Recent git status and diff:"
            git status --short
            git diff --stat || true
            exit 1
          fi
          git add -N .
          if ! git diff --exit-code --name-only; then
            echo "Docs are out of date. Changed files:"
            git diff --name-only
            exit 1
          fi
