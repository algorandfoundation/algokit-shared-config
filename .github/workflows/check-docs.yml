on:
  workflow_call:

jobs:
  check_docs:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Use Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: 22.x

      - name: Check docs are up to date
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts
          if ! pnpm run generate:code-docs; then
            echo "Docs generation failed. Recent git status and diff:"
            git status --short
            git diff --stat || true
            exit 1
          fi
          git add -N .
          if ! git diff --exit-code --name-only; then
            echo "Docs are out of date. Changed files:"
            git diff --name-only
            exit 1
          fi
