on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: 24.x
      docs-directory:
        description: "Directory containing the docs package.json"
        required: false
        type: string
        default: docs

jobs:
  check_docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1

      - name: Use Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6
        with:
          package_json_file: ${{ inputs.docs-directory }}/package.json

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install docs dependencies
        run: pnpm install --frozen-lockfile --dir ${{ inputs.docs-directory }}

      - name: Build documentation
        run: pnpm --dir ${{ inputs.docs-directory }} build
