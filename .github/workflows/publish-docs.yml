on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: 24.x
      docs-directory:
        description: "Directory containing the docs package.json"
        required: false
        type: string
        default: docs
      artifact-path:
        description: "Path to the built docs artifact"
        required: false
        type: string
        default: docs/dist

jobs:
  publish_docs:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Use Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          package_json_file: ${{ inputs.docs-directory }}/package.json

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install docs dependencies
        run: pnpm install --frozen-lockfile --dir ${{ inputs.docs-directory }}

      - name: Build documentation
        run: pnpm --dir ${{ inputs.docs-directory }} build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: algorandfoundation/algokit-shared-config/.github/actions/publish-docs@main
        with:
          artifact_path: ${{ inputs.artifact-path }}
