on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: 24.x
      working-directory:
        required: false
        type: string
        default: "."
      lint-script:
        required: false
        type: string
        default: npm run --if-present lint
      compile-script:
        required: false
        type: string
        default: npm run --if-present check-types
      pre-test-script:
        required: false
        type: string
      test-script:
        required: false
        type: string
        default: npm run --if-present test
      test-environment-variables:
        required: false
        type: string
        default: "{}"
      output-test-results:
        required: false
        type: boolean
        default: false
      test-results-file-pattern:
        required: false
        type: string
        default: "**/test-results.xml"
      audit-script:
        required: false
        type: string
        default: npm audit
      build-script:
        required: false
        type: string
        default: npm run build
      run-build:
        required: false
        type: boolean
        default: false
      run-commit-lint:
        required: false
        type: boolean
        default: false
      commit-lint-script:
        required: false
        type: string
        default: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      pre-run-script:
        required: false
        type: string
      install-algokit:
        description: "Install algokit via pipx and start localnet before tests"
        required: false
        type: boolean
        default: false
      setup-polytest:
        description: "Setup polytest framework before tests"
        required: false
        type: boolean
        default: false
      polytest-version:
        description: "Polytest version to install"
        required: false
        type: string
        default: "0.7.0"
      polytest-validate-script:
        description: "Script to validate polytest tests"
        required: false
        type: string
        default: ""
      polytest-generate-script:
        description: "Script to generate polytest files"
        required: false
        type: string
        default: ""
      polytest-generate-working-directory:
        description: "Working directory for polytest generation"
        required: false
        type: string
        default: "."
      run-mock-servers:
        description: "Start polytest mock servers (algod, indexer, kmd) before tests"
        required: false
        type: boolean
        default: false
    secrets:
      npm-auth-token:
        description: NPM auth token (don"t pass in on a PR build on a public repository)
        required: false

jobs:
  node-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"

      - name: Pre-run
        if: ${{ inputs.pre-run-script }}
        run: ${{ inputs.pre-run-script }}

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - run: npm rebuild && npm run --if-present prepare

      - name: Setup Polytest
        if: ${{ inputs.setup-polytest }}
        uses: algorandfoundation/algokit-polytest/.github/actions/setup-polytest@main
        with:
          version: ${{ inputs.polytest-version }}

      - name: Validate polytest tests
        if: ${{ inputs.polytest-validate-script != '' }}
        run: ${{ inputs.polytest-validate-script }}

      - name: Generate polytest files
        if: ${{ inputs.polytest-generate-script != '' }}
        working-directory: ${{ inputs.polytest-generate-working-directory }}
        run: ${{ inputs.polytest-generate-script }}

      - name: Audit
        run: ${{ inputs.audit-script }}

      - name: Commit lint
        if: ${{ inputs.run-commit-lint }}
        run: ${{ inputs.commit-lint-script }}

      - name: Lint
        run: ${{ inputs.lint-script }}

      - name: Compile
        run: ${{ inputs.compile-script }}

      - name: Install algokit
        if: ${{ inputs.install-algokit }}
        run: pipx install algokit

      - name: Start LocalNet
        if: ${{ inputs.install-algokit }}
        run: |
          algokit localnet start
          npx --yes wait-on tcp:4001 -t 30000

      - name: Start algod mock server
        if: ${{ inputs.run-mock-servers }}
        uses: algorandfoundation/algokit-polytest/.github/actions/run-mock-server@main
        with:
          client: algod

      - name: Start indexer mock server
        if: ${{ inputs.run-mock-servers }}
        uses: algorandfoundation/algokit-polytest/.github/actions/run-mock-server@main
        with:
          client: indexer

      - name: Start kmd mock server
        if: ${{ inputs.run-mock-servers }}
        uses: algorandfoundation/algokit-polytest/.github/actions/run-mock-server@main
        with:
          client: kmd

      - name: Pre-test
        if: ${{ inputs.pre-test-script }}
        run: ${{ inputs.pre-test-script }}

      - name: Test
        run: ${{ inputs.test-script }}
        env: ${{ fromJson(inputs.test-environment-variables) }}

      - name: Publish test results
        if: ${{ always() && inputs.output-test-results }}
        uses: phoenix-actions/test-reporting@v15
        with:
          name: Test results
          path: ${{ inputs.test-results-file-pattern }}
          reporter: jest-junit
          output-to: checks
          fail-on-error: false

      - name: Build
        if: ${{ inputs.run-build }}
        run: ${{ inputs.build-script }}
