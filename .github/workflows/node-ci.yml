on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: 18.x
      working-directory:
        required: false
        type: string
        default: "."
      lint-script:
        required: false
        type: string
        default: pnpm run --if-present lint
      compile-script:
        required: false
        type: string
        default: pnpm run --if-present check-types
      pre-test-script:
        required: false
        type: string
      test-script:
        required: false
        type: string
        default: pnpm run --if-present test
      test-environment-variables:
        required: false
        type: string
        default: "{}"
      output-test-results:
        required: false
        type: boolean
        default: false
      test-results-file-pattern:
        required: false
        type: string
        default: "**/test-results.xml"
      audit-script:
        required: false
        type: string
        default: pnpm audit
      build-script:
        required: false
        type: string
        default: pnpm run build
      run-build:
        required: false
        type: boolean
        default: false
      run-commit-lint:
        required: false
        type: boolean
        default: false
      commit-lint-script:
        required: false
        type: string
        default: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      pre-run-script:
        required: false
        type: string
    secrets:
      npm-auth-token:
        description: NPM auth token (don't pass in on a PR build on a public repository)
        required: false

jobs:
  node-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 1. Install pnpm before setting up Node
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      # setup node + private repo access
      - name: Use Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          cache-dependency-path: ${{ format('{0}/pnpm-lock.yaml', inputs.working-directory) }}

      - name: Pre-run
        if: ${{ inputs.pre-run-script }}
        run: ${{ inputs.pre-run-script }}
      - run: pnpm fetch --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm-auth-token || secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile --prod=false --offline
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm-auth-token || secrets.GITHUB_TOKEN }}
      - run: pnpm rebuild && pnpm run --if-present prepare

      - name: Audit
        run: ${{ inputs.audit-script }}

      - name: Commit lint
        if: ${{ inputs.run-commit-lint }}
        run: ${{ inputs.commit-lint-script }}

      - name: Lint
        run: ${{ inputs.lint-script }}

      - name: Compile
        run: ${{ inputs.compile-script }}

      - name: Pre-test
        if: ${{ inputs.pre-test-script }}
        run: ${{ inputs.pre-test-script }}

      - name: Test
        run: ${{ inputs.test-script }}
        env: ${{ fromJson(inputs.test-environment-variables) }}

      - name: Publish test results
        if: ${{ always() && inputs.output-test-results }}
        uses: phoenix-actions/test-reporting@v15
        with:
          name: Test results
          path: ${{ inputs.test-results-file-pattern }}
          reporter: jest-junit
          output-to: checks
          fail-on-error: false

      - name: Build
        if: ${{ inputs.run-build }}
        run: ${{ inputs.build-script }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm-auth-token || secrets.GITHUB_TOKEN }}
