name: "Publish Documentation"
description: "A composite action to upload and deploy documentation artifacts to GitHub Pages."

inputs:
  artifact_path:
    description: "The path to the documentation artifact to publish (e.g., docs/_html)"
    required: true
    type: string

runs:
  using: "composite"
  steps:
    - name: Upload artifact
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
      with:
        path: ${{ inputs.artifact_path }}

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
