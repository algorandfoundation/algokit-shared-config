name: Publish Python Docs to Algorand Developer Portal
description: Builds Python documentation with Sphinx and publishes to a dedicated docs branch for consumption by the Developer Portal

inputs:
  docs_path:
    description: "Location relative to the repo root of the docs folder"
    required: false
    default: ".devportal"
  docs_branch:
    description: "Name of the branch to publish the docs to"
    required: false
    default: "docs-dist"
  github_token:
    description: "GitHub token for publishing to docs branch"
    required: true
  guides_path:
    description: "Location of handwritten guides to copy (relative to repo root)"
    required: false
    default: "docs/guides"
  python_version:
    description: "Python version to use"
    required: false
    default: "3.12"
  build_command:
    description: "Command to build the devportal docs"
    required: false
    default: "poetry run poe docs-build-devportal"

outputs:
  docs_target:
    description: "The version target that was published (e.g., 'latest' or 'v1.2.3')"
    value: ${{ steps.publish.outputs.docs_target }}

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python_version }}

    - name: Install Poetry
      shell: bash
      run: pipx install poetry

    - name: Install dependencies
      shell: bash
      run: poetry install --with dev

    - name: Build docs
      shell: bash
      run: ${{ inputs.build_command }}

    - name: Publish docs
      id: publish
      uses: algorandfoundation/algokit-shared-config/.github/actions/devportal-publish-docs-core@chore/separate-actions
      with:
        docs_path: ${{ inputs.docs_path }}
        docs_branch: ${{ inputs.docs_branch }}
        github_token: ${{ inputs.github_token }}
        guides_path: ${{ inputs.guides_path }}
