name: Setup Algokit Python Environment
description: An action to setup the python environment with algokit and uv

inputs:
  python-version:
    description: "Python version to install"
    required: false
    default: "3.12"
  install-algokit:
    description: "Whether to install algokit via pipx and start localnet"
    required: false
    default: "true"
  working-directory:
    description: "Working directory for the project"
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: uv sync

    - name: Install algokit
      if: inputs.install-algokit == 'true'
      shell: bash
      run: pipx install algokit

    - name: Start LocalNet
      if: inputs.install-algokit == 'true'
      shell: bash
      run: algokit localnet start
